services:
  - type: web
    name: rosterhelix
    runtime: python
    plan: starter
    buildCommand: python -m compileall -q server.py scripts
    startCommand: python server.py
    healthCheckPath: /api/health
    envVars:
      - key: PUBLIC_SITE
        value: "1"
      - key: ROSTERHELIX_DATA_DIR
        value: /var/data
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_API_KEY
        generateValue: true
    disk:
      name: rosterhelix-data
      mountPath: /var/data
      sizeGB: 1
